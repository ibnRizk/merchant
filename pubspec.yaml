name: ssm_merchant
description: "SSM Merchant — store owner app for managing orders, menu and working hours."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # --- State management ---
  bloc: ^9.0.0
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7
  dartz: ^0.10.1

  # --- Dependency injection ---
  get_it: ^8.0.3

  # --- Networking ---
  dio: ^5.8.0+1
  connectivity_plus: ^7.0.0

  # --- Routing ---
  go_router: ^16.2.4

  # --- Storage ---
  shared_preferences: ^2.2.0
  flutter_secure_storage: ^9.0.0

  # --- Config ---
  flutter_dotenv: ^5.2.1

  # --- UI foundation ---
  flutter_screenutil: ^5.9.3
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.7
  cached_network_image: ^3.2.3
  shimmer: ^3.0.0
  fluttertoast: ^8.2.6
  loading_animation_widget: ^1.3.0
  photo_view: ^0.15.0

  # --- Utils ---
  intl: ^0.20.2
  logger: ^2.0.1
  url_launcher: ^6.3.1
  image_picker: ^1.2.3
  google_maps_flutter: ^2.18.1
  geolocator: ^14.0.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^5.0.0
  flutter_native_splash: ^2.4.8
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - .env
    - lang/
    - assets/images/
    - assets/icons/

  # Drop your brand font into assets/fonts/ and uncomment.
  # fonts:
  #   - family: AppFont
  #     fonts:
  #       - asset: assets/fonts/AppFont-Regular.ttf
  #         weight: 400
  #       - asset: assets/fonts/AppFont-Medium.ttf
  #         weight: 500
  #       - asset: assets/fonts/AppFont-SemiBold.ttf
  #         weight: 600
  #       - asset: assets/fonts/AppFont-Bold.ttf
  #         weight: 700

# Launcher icons. Regenerate after changing the logo:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/images/icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  # Adaptive icon: the logo is inset so launcher masks (circle, squircle)
  # don't clip its outer ring.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/icon.png
  adaptive_icon_foreground_inset: 16
  web:
    generate: true
    image_path: assets/images/icon.png
    background_color: "#FFFFFF"
    theme_color: "#173C66"

# Native launch screen shown before Flutter draws its first frame. Regenerate:
#   dart run flutter_native_splash:create
# `assets/launcher/` is a source folder for generators and is not bundled.
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/launcher/icon_padded.png
  color_dark: "#121212"
  image_dark: assets/launcher/icon_padded.png
  android_12:
    # Android 12+ masks the splash icon to a circle, so it uses the padded logo.
    image: assets/launcher/icon_padded.png
    icon_background_color: "#FFFFFF"
    color: "#FFFFFF"
    image_dark: assets/launcher/icon_padded.png
    icon_background_color_dark: "#FFFFFF"
    color_dark: "#121212"
  android: true
  ios: true
  web: false
